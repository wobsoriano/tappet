name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAPPET_IOS_DEVICE: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          cache: true

      - run: vp run -r build

      - id: simulator
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5
        with:
          model: 'iPhone 17 Pro'
          erase_before_boot: true
          wait_for_boot: true

      - name: Read the agent-device and Xcode versions for the cache key
        id: versions
        run: |
          echo "agent_device=$(./node_modules/.bin/agent-device --version)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
        working-directory: packages/tappet

      # The XCTest runner takes minutes to build the first time it drives a device.
      - uses: actions/cache@v4
        with:
          path: ~/.agent-device/apple-runner/derived
          key: apple-runner-${{ steps.versions.outputs.agent_device }}-${{ steps.versions.outputs.xcode }}

      # The library source is deliberately not in this hash. The app never imports tappet, which is a
      # devDependency the specs use on the host, so a library change cannot alter the native build.
      - name: Compute native build cache key
        id: native-build-key
        env:
          XCODE: ${{ steps.versions.outputs.xcode }}
        run: |
          build_hash="$(
            {
              git ls-files -s -- \
                pnpm-lock.yaml \
                pnpm-workspace.yaml \
                apps/e2e/package.json \
                apps/e2e/app.json \
                apps/e2e/app \
                apps/e2e/src \
                apps/e2e/assets
              echo "xcode=$XCODE"
            } | git hash-object --stdin
          )"
          echo "hash=$build_hash" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        id: native-build-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/e2e/ios/build/Build/Products/Release-iphonesimulator/tappete2e.app
          # Bump the version when the build commands below change.
          key: tappet-native-v1-ios-${{ steps.native-build-key.outputs.hash }}

      # Release bundles the JavaScript into the app, so no Metro server has to stay alive for the run.
      - name: Build the app in Release for the simulator
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/e2e
        run: |
          npx expo prebuild --clean --platform ios
          xcodebuild \
            -workspace ios/tappete2e.xcworkspace \
            -scheme tappete2e \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            build

      - name: Save native build
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/e2e/ios/build/Build/Products/Release-iphonesimulator/tappete2e.app
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}

      - name: Install the app
        run: |
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" \
            apps/e2e/ios/build/Build/Products/Release-iphonesimulator/tappete2e.app

      # The test run reuses this daemon, because both sides are the workspace's pinned agent-device.
      - name: Prepare the iOS runner
        working-directory: packages/tappet
        run: ./node_modules/.bin/agent-device prepare ios-runner --platform ios --timeout 240000

      # The workspace binary, not vp run. The agent-device daemon inherits vp run's task IPC
      # environment and vp run then waits for it, so the step would hang after the suite finished.
      # pnpm itself is not on PATH under setup-vp, which is why this is not `pnpm --filter`.
      - run: ./node_modules/.bin/playwright test --project=ios
        working-directory: apps/e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ios
          path: apps/e2e/playwright-report
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAPPET_ANDROID_DEVICE: ci-api34
      ANDROID_API_LEVEL: '34'
    steps:
      - uses: actions/checkout@v5

      # The Android SDK image plus a Release build do not fit next to the toolchains the image ships with.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          cache: true

      - run: vp run -r build

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The library source is deliberately not in this hash. The app never imports tappet, which is a
      # devDependency the specs use on the host, so a library change cannot alter the native build.
      - name: Compute native build cache key
        id: native-build-key
        run: |
          build_hash="$(
            {
              git ls-files -s -- \
                pnpm-lock.yaml \
                pnpm-workspace.yaml \
                apps/e2e/package.json \
                apps/e2e/app.json \
                apps/e2e/app \
                apps/e2e/src \
                apps/e2e/assets
              echo "api-level=$ANDROID_API_LEVEL"
            } | git hash-object --stdin
          )"
          echo "hash=$build_hash" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        id: native-build-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/e2e/android/app/build/outputs/apk/release/app-release.apk
          # Bump the version when the build commands below change.
          key: tappet-native-v1-android-${{ steps.native-build-key.outputs.hash }}

      - name: Build the app in Release
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/e2e
        run: |
          npx expo prebuild --clean --platform android
          ./android/gradlew -p android assembleRelease

      - name: Save native build
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/e2e/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.native-build-cache.outputs.cache-primary-key }}

      - id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ANDROID_API_LEVEL }}-google_apis-x86_64

      - name: Create the AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          avd-name: ci-api34
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "the AVD is created and cached"

      - name: Run the suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          avd-name: ci-api34
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apps/e2e/android/app/build/outputs/apk/release/app-release.apk
            cd apps/e2e && ./node_modules/.bin/playwright test --project=android

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-android
          path: apps/e2e/playwright-report
          retention-days: 7
